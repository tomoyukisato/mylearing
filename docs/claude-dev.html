<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Code 開発スタイル確立 1ヶ月ロードマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#17222E; --muted:#5B6878; --line:#D3DAE2; --track:#DCE2E9;
  --w1:#3D6FA8; --w2:#2A857C; --w3:#7556B0; --w4:#B8730E; --final:#17222E;
  --radius-lg:18px; --radius-sm:8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A23; --surface:#1A2430; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2C3946; --track:#273340;
    --w1:#6FA0D8; --w2:#4FB8AD; --w3:#A68BDB; --w4:#E3A23F; --final:#E6ECF2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A23; --surface:#1A2430; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2C3946; --track:#273340;
  --w1:#6FA0D8; --w2:#4FB8AD; --w3:#A68BDB; --w4:#E3A23F; --final:#E6ECF2;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px); }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:16px; line-height:1.8; -webkit-font-smoothing:antialiased;
}
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
img,svg{ max-width:100%; }
code{ font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; font-size:.88em; background:var(--track); padding:.05em .35em; border-radius:4px; }
a{ color:inherit; }
:focus-visible{ outline:3px solid var(--w1); outline-offset:3px; border-radius:4px; }

.wrap{ max-width:1080px; margin:0 auto; padding:0 24px; }

/* Hero */
.hero{ display:grid; grid-template-columns: 1.1fr .9fr; gap:48px; align-items:center; padding:64px 0 40px; }
.hero h1{ font-size:clamp(2rem,4.6vw,3.25rem); line-height:1.25; font-weight:900; letter-spacing:.01em; margin:0 0 20px; }
.hero .lead{ font-size:1.0625rem; color:var(--muted); max-width:34em; margin:0 0 28px; }
.status{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px 22px; max-width:30rem; }
.status-row{ display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; }
.status label{ font-weight:700; font-size:.9375rem; }
.status input[type=date]{ font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm); padding:6px 10px; }
.status .now{ margin:12px 0 0; font-size:1rem; }
.status .now strong{ font-weight:900; }
.status .msg{ margin:6px 0 0; color:var(--muted); font-size:.9375rem; }

.rings-box{ position:relative; justify-self:center; width:100%; max-width:400px; }
.rings-box svg{ display:block; width:100%; height:auto; }
.ring-track{ fill:none; stroke:var(--track); }
.ring-fill{ fill:none; stroke-linecap:round; transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1); transform:rotate(-90deg); transform-origin:200px 200px; }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
.ring-center .pct{ font-size:clamp(2.25rem,6vw,3rem); font-weight:900; line-height:1; }
.ring-center .cap{ font-size:.8125rem; color:var(--muted); margin-top:6px; }
.legend{ list-style:none; padding:0; margin:18px 0 0; display:grid; grid-template-columns:1fr 1fr; gap:6px 16px; font-size:.875rem; }
.legend li{ display:flex; align-items:center; gap:8px; }
.legend .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
.legend .lp{ margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
.rings-note{ font-size:.8125rem; color:var(--muted); margin:10px 0 0; text-align:center; }

/* Week nav */
.weeknav{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line); }
.weeknav ol{ list-style:none; margin:0 auto; padding:10px 24px; max-width:1080px; display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.weeknav a{ display:block; text-decoration:none; padding:6px 10px 8px; border-radius:var(--radius-sm); font-size:.8125rem; font-weight:700; }
.weeknav a:hover{ background:var(--surface); }
.weeknav .bar{ display:block; height:4px; border-radius:2px; background:var(--track); margin-top:5px; overflow:hidden; }
.weeknav .bar i{ display:block; height:100%; width:0; background:var(--c); transition:width .5s ease; }
.weeknav a.current{ background:var(--surface); box-shadow: inset 0 0 0 1.5px var(--c); }

/* Week sections */
main{ padding:32px 0 80px; }
.week{ --c:var(--w1); display:grid; grid-template-columns:96px 1fr; gap:0 28px; padding:48px 0; border-top:1px solid var(--line); }
.week:first-child{ border-top:0; }
.wnum{ font-size:4.5rem; font-weight:900; line-height:1; color:var(--c); font-variant-numeric:tabular-nums; }
.wnum small{ display:block; font-size:.8125rem; font-weight:700; color:var(--muted); margin-top:8px; letter-spacing:.02em; }
.week h2{ font-size:clamp(1.375rem,2.6vw,1.75rem); line-height:1.4; margin:4px 0 18px; font-weight:900; }
.goal{ position:relative; background:var(--surface); border-radius:var(--radius-lg); padding:22px 24px 22px 28px; border-left:6px solid var(--c); margin:0 0 28px; }
.goal p{ margin:0; font-size:1.125rem; font-weight:700; line-height:1.7; }
.goal .gl{ display:block; font-size:.8125rem; font-weight:700; color:var(--c); margin-bottom:6px; }
.goal .badge{ position:absolute; top:-12px; right:16px; background:var(--c); color:var(--surface); font-size:.8125rem; font-weight:900; padding:3px 12px; border-radius:999px; opacity:0; transform:scale(.8); transition:opacity .3s, transform .3s; }
.week.done .goal .badge{ opacity:1; transform:scale(1); }

.cols{ display:grid; grid-template-columns:1fr 1fr; gap:32px; }
.week h3{ font-size:1rem; font-weight:900; margin:0 0 10px; }
.learn ul{ margin:0 0 22px; padding-left:1.2em; }
.learn li{ margin:0 0 6px; }
.learn li::marker{ color:var(--c); }
.learn .mat{ font-size:.9375rem; }
.learn .mat a{ color:var(--ink); text-decoration-color:var(--c); text-decoration-thickness:2px; text-underline-offset:3px; font-weight:500; }
.learn .mat a:hover{ color:var(--c); }
.learn .mat .mn{ display:block; font-size:.8125rem; color:var(--muted); }

.checks{ list-style:none; margin:0 0 24px; padding:0; }
.checks li{ margin:0 0 8px; }
.checks label{ display:flex; gap:12px; align-items:flex-start; cursor:pointer; padding:10px 12px; border-radius:var(--radius-sm); background:var(--surface); border:1px solid var(--line); transition:border-color .2s; }
.checks label:hover{ border-color:var(--c); }
.checks input{ appearance:none; -webkit-appearance:none; flex:none; width:22px; height:22px; margin:2px 0 0; border:2px solid var(--line); border-radius:6px; background:var(--bg); display:grid; place-content:center; cursor:pointer; transition:background .15s,border-color .15s; }
.checks input::after{ content:""; width:11px; height:6px; border-left:3px solid var(--surface); border-bottom:3px solid var(--surface); transform:rotate(-45deg) translate(1px,-1px); opacity:0; }
.checks input:checked{ background:var(--c); border-color:var(--c); }
.checks input:checked::after{ opacity:1; }
.checks input:checked + span{ color:var(--muted); }
.checks .kind{ display:inline-block; font-size:.75rem; font-weight:700; color:var(--c); margin-right:6px; }
.sub{ color:var(--muted); font-size:.875rem; margin:-4px 0 12px; }
.warn{ border-left:3px solid var(--w4); padding:2px 0 2px 12px; margin:0 0 16px; font-size:.9375rem; }

/* Final */
.final{ --c:var(--final); }
.next{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:8px; }
.next div{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; }
.next strong{ display:block; }
.next span{ color:var(--muted); font-size:.9375rem; }

footer{ border-top:1px solid var(--line); padding:24px 0 40px; color:var(--muted); font-size:.875rem; }
footer button{ font:inherit; color:var(--muted); background:none; border:1px solid var(--line); border-radius:var(--radius-sm); padding:4px 12px; cursor:pointer; }
footer button:hover{ color:var(--ink); }

@media (max-width:860px){
  .hero{ grid-template-columns:1fr; gap:32px; padding-top:40px; }
  .rings-box{ max-width:340px; }
  .cols{ grid-template-columns:1fr; gap:8px; }
  .weeknav ol{ grid-template-columns:repeat(5,minmax(0,1fr)); padding:8px 12px; gap:4px; }
  .weeknav a{ padding:4px 6px 6px; font-size:.75rem; }
}
@media (max-width:600px){
  .wrap{ padding:0 18px; }
  .week{ grid-template-columns:1fr; padding:36px 0; }
  .wnum{ font-size:3rem; display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .wnum small{ margin:0; }
  .next{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ transition:none !important; animation:none !important; }
}
</style>
</head>
<body>

<header class="wrap hero">
  <div>
    <h1>Claude Codeで<br>自分の開発スタイルをつくる</h1>
    <p class="lead">1ヶ月後、Claude Codeの機能を「何の問題を解くためのものか」で説明でき、自分のワークフローをPluginとして人に渡せるようになる。チェックを入れるたびに、仕組みの理解から委任の設計まで、層が1枚ずつ重なっていきます。</p>
    <div class="status">
      <div class="status-row">
        <label for="start">開始日</label>
        <input type="date" id="start">
      </div>
      <p class="now" id="now">開始日を入れると、今いる週と残り日数が表示されます。</p>
      <p class="msg" id="msg"></p>
    </div>
  </div>
  <div class="rings-box">
    <div style="position:relative">
      <svg viewBox="0 0 400 400" role="img" aria-labelledby="ringsTitle">
        <title id="ringsTitle">週ごとの達成度を表す4重のリング</title>
        <g id="rings"></g>
      </svg>
      <div class="ring-center"><span class="pct" id="pct">0%</span><span class="cap">全体の達成度</span></div>
    </div>
    <ul class="legend" id="legend"></ul>
    <p class="rings-note">内側から外側へ、仕組み → 明文化 → 検証 → 委任の順に重ねます</p>
  </div>
</header>

<nav class="weeknav" aria-label="週の切り替え"><ol id="nav"></ol></nav>

<main class="wrap" id="weeks"></main>

<footer class="wrap">
  <p>チェックの状態と開始日は、このブラウザにだけ保存されます。</p>
  <button type="button" id="reset">チェックと開始日をリセット</button>
</footer>

<script>
const WEEKS = [
  { id:"w1", color:"--w1", label:"Week 1", short:"仕組み", layer:"仕組み",
    title:"エージェントの仕組みとコンテキストを理解する",
    goal:"Claude Codeの1ターンで何が起きているか、そしてなぜ長いセッションほど精度が落ちるのかを、自分の言葉で説明できる。",
    learn:["エージェント＝LLMがツールをループの中で自律的に使うもの、という捉え方","LLMは「もっともらしさ」を出力する：確率的で揺れること、もっともらしいことと正しいことは別物","コンテキストエンジニアリング：コンテキストは有限で、詰め込むほど精度が落ちる（context rot）","基本操作：Plan Mode、権限設定、`/clear`・`/compact`・巻き戻し、CLAUDE.md","常時オンの指示の置き場所：CLAUDE.md（事実とルール）、`.claude/rules/`（特定のパスだけで読み込むルール）、Output styles（応答の仕方）","モデル選択（Opus・Sonnet・Haiku）、思考量、利用上限：速度・品質・コストのトレードオフ"],
    mats:[
      {t:"Building effective agents", u:"https://www.anthropic.com/engineering/building-effective-agents", n:"Anthropicブログ・英語／考え方の土台"},
      {t:"Effective context engineering for AI agents", u:"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents", n:"Anthropicブログ・英語／今月の最重要教材"},
      {t:"Claude Code を拡張する（機能の全体像）", u:"https://code.claude.com/docs/ja/features-overview", n:"公式Docs・日本語"},
      {t:"How Claude Code works", u:"https://code.claude.com/docs/ja/how-claude-code-works", n:"公式Docs・コアループの仕組み"},
      {t:"CLAUDE.md（メモリ）", u:"https://code.claude.com/docs/ja/memory", n:"公式Docs"},
      {t:"コンテキストウィンドウを探索する", u:"https://code.claude.com/docs/ja/context-window", n:"公式Docs・何がコンテキストを使っているか"},
      {t:"Output styles", u:"https://code.claude.com/docs/ja/output-styles", n:"公式Docs・CLAUDE.mdとの使い分け"}
    ],
    taskTitle:"アウトプット",
    tasks:["EC-CUBEのCLAUDE.mdを書き直す（Claudeが実際に2回以上間違えたことだけ残し、200行以内に）。ストアの引き継ぎ資料も兼ねる","A4一枚のメモ「コンテキストに入れるもの・入れないもの」を書く","`/context` で、自分のセッションが何にコンテキストを使っているか確認する","言語やディレクトリ固有のルール（PHP・Twig・JSなど）を `.claude/rules/` に切り出す","同じタスクをSonnetとOpusで試し、速度・品質・コストの差をメモする"],
    checks:["「エージェントとは何か」を1文で説明できる","context rot とは何か、どう防ぐかを説明できる","CLAUDE.mdに書くべきこと・書くべきでないことを区別できる","ある指示をCLAUDE.md・rules・Output styleのどこに置くべきか、理由つきで判断できる","公式Docsの機能一覧を見て、まだ試していない新機能がないか確認した"] },
  { id:"w2", color:"--w2", label:"Week 2", short:"明文化", layer:"明文化",
    title:"明文化と仕様駆動の再設計（Skills・Subagents）",
    goal:"実タスク1件を新しいspecワークフローで最後まで回し、メインのコンテキストを汚さずに完了できる。",
    learn:["暗黙知の明文化：AIは書かれていないことを知らない。仕様駆動の本質はここにある","Skills と Subagents の違い：再利用できる「中身」か、隔離された「作業者」か","タスクの規模に応じてプロセスの重さを変える","組み込みスキル（`/code-review`・`/batch`・`/debug` など）：自作する前に、既存のものを知る"],
    mats:[
      {t:"Skills", u:"https://code.claude.com/docs/ja/skills", n:"公式Docs"},
      {t:"コマンドと組み込みスキル", u:"https://code.claude.com/docs/ja/commands", n:"公式Docs"},
      {t:"Subagents", u:"https://code.claude.com/docs/ja/sub-agents", n:"公式Docs"},
      {t:"Steering Claude Code: when to use CLAUDE.md, skills, hooks, and subagents", u:"https://claude.com/blog/steering-claude-code-skills-hooks-rules-subagents-and-more", n:"Claudeブログ・英語／使い分けの判断軸"},
      {t:"Claude Code: Best practices for agentic coding", u:"https://www.anthropic.com/engineering/claude-code-best-practices", n:"Anthropicブログ・英語"}
    ],
    taskTitle:"アウトプット",
    tasks:["`/spec-design`・`/spec-tasks`・`/spec-implement` をSkillとして書き直す","既存コード調査用とレビュー用のSubagentを定義する","タスク規模別の運用ルールを決める（小：Plan Modeのみ／中：tasks→implement／大：フルコース）","組み込みスキルを一通り試し、自作のspecスキルと役割が重なっていないか確認する","副作用のあるスキルに `disable-model-invocation: true` を設定し、自分が呼んだときだけ動くようにする"],
    checks:["SkillとSubagentのどちらを使うべきか、具体例で判断できる","specワークフローで実タスク1件を完了した","調査の中間出力がメインの会話に流れ込んでいない","公式Docsの機能一覧を見て、まだ試していない新機能がないか確認した"] },
  { id:"w3", color:"--w3", label:"Week 3", short:"検証", layer:"検証",
    title:"検証と自動化を組み込む（Hooks・MCP）",
    goal:"Claudeがテストを通すまで自分で走りきり、人間は結果をレビューするだけで済む状態を、1つのタスクで実現する。",
    learn:["検証可能性とフィードバックループ：AIに任せられる範囲は、検証手段の量で決まる","決定論と確率論の境界：CLAUDE.mdやSkillの指示は「要求」、Hookは「保証」","Hooks のライフサイクルイベントと、MCP による外部接続","Code intelligence：言語サーバー経由のシンボル検索と型エラーのライブ表示で、ファイルの読み込みを減らす"],
    mats:[
      {t:"Hooks ガイド", u:"https://code.claude.com/docs/ja/hooks-guide", n:"公式Docs"},
      {t:"MCP", u:"https://code.claude.com/docs/ja/mcp", n:"公式Docs"},
      {t:"Code intelligence プラグイン", u:"https://code.claude.com/docs/ja/plugins/code-intelligence", n:"公式Docs"},
      {t:"Writing effective tools for agents — with agents", u:"https://www.anthropic.com/engineering/writing-tools-for-agents", n:"Anthropicブログ・英語／AIが使いやすいツール設計"}
    ],
    taskTitle:"アウトプット",
    tasks:["lint・型チェック・テストを自動で走らせるHooksを入れる","`.env` など触らせたくないファイルの編集を `PreToolUse` Hookでブロックする","`/spec-implement` に完了条件（検証ステップ）を組み込む","一覧表「プロンプトに残すもの／Hookに寄せるもの」を作る","PHP・TypeScript用のcode intelligenceプラグインを入れ、導入前後で `/context` の使用量を比べる"],
    checks:["「この指示はHookにすべきか」を理由つきで判断できる","Claudeがテスト失敗を自分で読んで直すループが回っている","検証ステップなしで完了扱いになるタスクがない","code intelligenceの導入で、型エラーにClaudeが自分で気づけるようになった","公式Docsの機能一覧を見て、まだ試していない新機能がないか確認した"] },
  { id:"w4", color:"--w4", label:"Week 4", short:"委任・配布", layer:"委任",
    title:"委任・リスク・配布",
    goal:"自分のやり方を他の人がインストールして再現でき、その設計の理由を原則として説明できる。",
    learn:["委任の設計：どこまで自律させ、どこで人間が判断するか","リスク：プロンプトインジェクション、過剰な権限、MCP接続先の信頼性（セキュリティ学習とつながる部分）","並列化（git worktree）、非対話実行（`claude -p`）、GitHub Actions","Plugins と marketplace による配布","Dynamic workflows と Cross-session messaging：Subagent数個に収まらない作業と、セッション間の連携","設定のスコープ（ユーザー・プロジェクト・プラグイン・管理ポリシー）と重なり方：CLAUDE.mdは加算、SkillsとSubagentsは名前で上書き、Hooksはマージ","実行環境の広がり（デスクトップ・Web・モバイルからのリモート操作）と、同じ基盤で自分のエージェントを作る Claude Agent SDK"],
    mats:[
      {t:"セキュリティ", u:"https://code.claude.com/docs/ja/security", n:"公式Docs"},
      {t:"権限（Permissions）", u:"https://code.claude.com/docs/ja/permissions", n:"公式Docs"},
      {t:"複数のClaudeを並列で実行する", u:"https://code.claude.com/docs/ja/agents", n:"公式Docs"},
      {t:"Dynamic workflows", u:"https://code.claude.com/docs/ja/workflows", n:"公式Docs"},
      {t:"Cross-session messaging", u:"https://code.claude.com/docs/ja/cross-session-messaging", n:"公式Docs"},
      {t:"Claude Code GitHub Actions", u:"https://code.claude.com/docs/ja/github-actions", n:"公式Docs"},
      {t:"Plugins", u:"https://code.claude.com/docs/ja/plugins/overview", n:"公式Docs"},
      {t:"Marketplace を作る", u:"https://code.claude.com/docs/ja/plugins/create-marketplace", n:"公式Docs"},
      {t:"Effective harnesses for long-running agents", u:"https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents", n:"Anthropicブログ・英語"}
    ],
    taskTitle:"アウトプット",
    tasks:["git worktreeで2つのタスクを並列に進めてみる","`claude -p` で定型作業（例：PRの要約）を1つ自動化する","Week 2〜3の成果（Skills・Subagents・Hooks）をPluginにまとめ、READMEを書く","Dynamic workflowで、コードベースの小さな監査（例：未使用コードの洗い出し）を1回試す","チームに配布するときに、Pluginに入れるものと各自の設定に任せるものを決める","Week 1と比べて、自分のワークフローの変化を1つの指標で比べる（例：手で直した回数、待ち時間）"],
    checks:["権限設定を読んで、Claudeに許している範囲を説明できる","別のリポジトリにPluginを入れて、同じワークフローが動いた","プロンプトインジェクションのリスクと、自分の設定での対策を説明できる","設定が複数のレベルにあるとき、どれが効くかを説明できる","公式Docsの機能一覧を見て、まだ試していない新機能がないか確認した"] }
];

const KEY = "cc-roadmap-v1";
let state = { checked:{}, start:"" };
try{ const s = localStorage.getItem(KEY); if(s){ const p = JSON.parse(s); state = { checked:p.checked||{}, start:p.start||"" }; } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

function itemsOf(w){ return [...w.tasks.map((t,i)=>w.id+"-t"+i), ...w.checks.map((c,i)=>w.id+"-c"+i)]; }
const FINAL_ID = "final-t0";

function checklist(w, list, prefix, kind){
  return `<ul class="checks">${list.map((t,i)=>{
    const id = `${w.id}-${prefix}${i}`;
    return `<li><label><input type="checkbox" data-id="${id}" data-w="${w.id}" ${state.checked[id]?"checked":""}><span>${kind?`<span class="kind">${kind}</span>`:""}${fmt(t)}</span></label></li>`;
  }).join("")}</ul>`;
}

/* Render weeks */
const weeksEl = document.getElementById("weeks");
weeksEl.innerHTML = WEEKS.map((w,n)=>`
<section class="week" id="${w.id}" style="--c:var(${w.color})">
  <div class="wnum">${n+1}<small>Week ${n+1}・${7*n+1}〜${7*n+7}日目</small></div>
  <div>
    <h2>${w.title}</h2>
    <div class="goal"><span class="gl">この週のゴール</span><p>${fmt(w.goal)}</p><span class="badge">達成</span></div>
    <div class="cols">
      <div class="learn">
        <h3>学ぶこと</h3>
        <ul>${w.learn.map(l=>`<li>${fmt(l)}</li>`).join("")}</ul>
        ${w.mats.length?`<h3>教材</h3><ul class="mat">${w.mats.map(m=>`<li><a href="${m.u}" target="_blank" rel="noopener noreferrer">${fmt(m.t)}</a>${m.n?`<span class="mn">${fmt(m.n)}</span>`:""}</li>`).join("")}</ul>`:""}
      </div>
      <div>
        <h3>${w.taskTitle || (n===0?"アウトプット":"自分のシステムでやること")}</h3>
        ${w.warn?`<p class="warn">${fmt(w.warn)}</p>`:""}
        ${checklist(w, w.tasks, "t", "")}
        <h3>到達チェック</h3>
        <p class="sub">全部に「はい」と言えたら次の週へ</p>
        ${checklist(w, w.checks, "c", "")}
      </div>
    </div>
  </div>
</section>`).join("") + `
<section class="week final" id="final">
  <div class="wnum">✓<small>仕上げ</small></div>
  <div>
    <h2>自分のAI開発原則を書く</h2>
    <div class="goal"><span class="gl">1ヶ月の締め</span><p>4週間で得た判断を10行程度の原則にまとめる。たとえば「保証が必要なものはプロンプトではなくHookに書く」「同じ指摘を2回したらCLAUDE.mdに入れる」。ツールが変わっても持ち運べる、自分のやり方の核になります。</p><span class="badge">完走</span></div>
    <ul class="checks"><li><label><input type="checkbox" data-id="${FINAL_ID}" data-w="final" ${state.checked[FINAL_ID]?"checked":""}><span>「自分のAI開発原則」10行を書き、PluginのREADMEに載せる</span></label></li></ul>
    <h3>その先へ</h3>
    <div class="next">
      <div><strong>チームに広げる</strong><span>転職先のチームでPluginを配布し、使われ方からSkillやCLAUDE.mdを改訂する</span></div>
      <div><strong>仕組みを作る側へ</strong><span>Claude Agent SDKで、自分専用のエージェントを組んでみる</span></div>
    </div>
  </div>
</section>`;

/* Nav + legend */
document.getElementById("nav").innerHTML = WEEKS.map(w=>`<li><a href="#${w.id}" data-nav="${w.id}" style="--c:var(${w.color})">${w.label}<br>${w.short}<span class="bar"><i></i></span></a></li>`).join("") +
  `<li><a href="#final" data-nav="final" style="--c:var(--final)">仕上げ<br>開発原則<span class="bar"><i></i></span></a></li>`;
document.getElementById("legend").innerHTML = WEEKS.map(w=>`<li><span class="dot" style="background:var(${w.color})"></span>${w.layer}（${w.label}）<span class="lp" data-lp="${w.id}">0%</span></li>`).join("");

/* Rings: inner = week 1, outer = week 4 */
const R = [70, 104, 138, 172], SW = 22;
const ringsEl = document.getElementById("rings");
ringsEl.innerHTML = WEEKS.map((w,i)=>{
  const c = 2*Math.PI*R[i];
  return `<circle class="ring-track" cx="200" cy="200" r="${R[i]}" stroke-width="${SW}"/>
          <circle class="ring-fill" data-ring="${w.id}" cx="200" cy="200" r="${R[i]}" stroke-width="${SW}" stroke="var(${w.color})" stroke-dasharray="${c}" stroke-dashoffset="${c}"/>`;
}).join("");

function ratio(ids){ return ids.length ? ids.filter(id=>state.checked[id]).length/ids.length : 0; }

const MSGS = [
  [0,   "まずはWeek 1の教材を1本。読むだけで機能の見え方が変わります。"],
  [.01, "動き出しました。毎日1つチェックが増えれば十分なペースです。"],
  [.25, "1/4を超えました。仕組みの層ができてきています。"],
  [.5,  "折り返し地点。ここからは検証と自動化で、任せられる範囲を広げます。"],
  [.75, "ゴールが見えています。最後は委任と配布で、やり方を人に渡せる形にします。"],
  [1,   "4つの層がそろいました。開発原則にまとめて完走です。"]
];

function update(){
  let all = [];
  WEEKS.forEach((w,i)=>{
    const ids = itemsOf(w); all = all.concat(ids);
    const r = ratio(ids);
    const c = 2*Math.PI*R[i];
    document.querySelector(`[data-ring="${w.id}"]`).setAttribute("stroke-dashoffset", c*(1-r));
    document.querySelector(`[data-lp="${w.id}"]`).textContent = Math.round(r*100)+"%";
    document.querySelector(`[data-nav="${w.id}"] .bar i`).style.width = (r*100)+"%";
    document.getElementById(w.id).classList.toggle("done", r===1);
  });
  all.push(FINAL_ID);
  const fr = state.checked[FINAL_ID]?1:0;
  document.querySelector(`[data-nav="final"] .bar i`).style.width = (fr*100)+"%";
  document.getElementById("final").classList.toggle("done", fr===1);
  const total = ratio(all);
  document.getElementById("pct").textContent = Math.round(total*100)+"%";
  let m = MSGS[0][1]; MSGS.forEach(([t,s])=>{ if(total>=t) m=s; });
  document.getElementById("msg").textContent = m;
  updateNow();
}

function updateNow(){
  const now = document.getElementById("now");
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.remove("current"));
  if(!state.start){ now.textContent = "開始日を入れると、今いる週と残り日数が表示されます。"; return; }
  const s = new Date(state.start+"T00:00:00"), t = new Date(); t.setHours(0,0,0,0);
  const day = Math.floor((t - s)/86400000) + 1;
  if(day < 1){ now.innerHTML = `開始まであと <strong>${1-day}日</strong>。準備はWeek 1の教材を手元にそろえるだけでOKです。`; return; }
  if(day > 28){ now.innerHTML = `<strong>${day}日目</strong>。予定の28日を過ぎました。残りのチェックを片付けて、開発原則で締めましょう。`; document.querySelector('[data-nav="final"]').classList.add("current"); return; }
  const wk = Math.ceil(day/7);
  now.innerHTML = `今日は <strong>${day}日目</strong>、<strong>Week ${wk}</strong>（${WEEKS[wk-1].short}）。ゴールまであと ${28-day}日です。`;
  document.querySelector(`[data-nav="w${wk}"]`).classList.add("current");
}

document.addEventListener("change", e=>{
  const el = e.target;
  if(el.matches('input[type="checkbox"][data-id]')){
    state.checked[el.dataset.id] = el.checked; save(); update();
  } else if(el.id === "start"){
    state.start = el.value; save(); updateNow();
  }
});
document.getElementById("reset").addEventListener("click", ()=>{
  if(!confirm("チェックと開始日をすべて消します。よろしいですか？")) return;
  state = { checked:{}, start:"" }; save();
  document.querySelectorAll('input[type="checkbox"][data-id]').forEach(c=>c.checked=false);
  document.getElementById("start").value = ""; update();
});

document.getElementById("start").value = state.start;
update();
</script>
</body>
</html>
