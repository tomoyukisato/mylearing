<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学習ロードマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#17222E; --muted:#5B6878; --line:#D3DAE2;
  --accent:#3D6FA8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A23; --surface:#1A2430; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2C3946;
    --accent:#6FA0D8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A23; --surface:#1A2430; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2C3946;
  --accent:#6FA0D8;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  line-height:1.7; -webkit-font-smoothing:antialiased;
}
:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; border-radius:6px; }
main{ max-width:720px; margin:0 auto; padding:48px 20px 64px; }
h1{ font-size:1.5rem; font-weight:900; margin:0 0 24px; }

.list{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.list a{
  display:grid; grid-template-columns:6px 1fr auto; gap:0 16px; align-items:center;
  padding:16px 4px; border-bottom:1px solid var(--line);
  color:inherit; text-decoration:none;
}
.list a:hover{ background:var(--surface); }
.bar{ width:6px; height:100%; min-height:40px; border-radius:3px; background:var(--c, var(--accent)); }
.name{ font-weight:700; }
.desc{ display:block; font-size:.875rem; color:var(--muted); }
.meta{ font-size:.8125rem; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>
<main>
  <h1>学習ロードマップ</h1>
  <ul class="list" id="list"></ul>
</main>
<script>
// 学習テーマを増やすときは、この配列に1行追加する
const ITEMS = [
  { name:"セキュリティ強化", desc:"Webアプリ・認証・インフラの学習", period:"1ヶ月", color:"#3D6FA8",
    url:"/mylearing/security" },
  { name:"Claude Code 開発スタイル学習", desc:"仕組み・明文化・検証・委任の学習", period:"1ヶ月", color:"#2A857C",
    url:"/mylearing/claude-dev" }
];

document.getElementById("list").innerHTML = ITEMS.map(i => `
  <li><a href="${i.url}" target="_blank" rel="noopener noreferrer" style="--c:${i.color}">
    <span class="bar"></span>
    <span><span class="name">${i.name}</span><span class="desc">${i.desc}</span></span>
    <span class="meta">${i.period}</span>
  </a></li>`).join("");
</script>
</body>
</html>
